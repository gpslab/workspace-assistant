name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel outdated runs of the same ref on a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job for all tooling: composer install once, then validate/cs/stan/test in a row.
  # GitHub bills each job rounded up to a minute, so separate jobs would cost more for nothing.
  # Steps use `if: ${{ !cancelled() }}` so that one failure does not hide the others.
  ci:
    name: CI (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.4 is the minimum from composer.json, 8.5 is the production version.
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, pdo, pdo_sqlite, sqlite3
          # Coverage only in the production-version job: it prints the summary, the other job stays fast.
          coverage: ${{ matrix.php == '8.5' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate composer.json
        if: ${{ !cancelled() }}
        run: composer validate --strict

      - name: PHP-CS-Fixer
        if: ${{ !cancelled() }}
        run: composer cs:check

      - name: PHPStan
        if: ${{ !cancelled() }}
        run: composer stan

      - name: PHPUnit
        if: ${{ !cancelled() }}
        run: composer ${{ matrix.php == '8.5' && 'test:coverage' || 'test' }}

      # Coverage on the run page (job summary) and coverage.xml as an artifact; 8.5 job only.
      - name: Coverage summary
        if: ${{ !cancelled() && matrix.php == '8.5' && hashFiles('coverage.xml') != '' }}
        run: |
          php <<'PHP' >> "$GITHUB_STEP_SUMMARY"
          <?php
            $m = simplexml_load_file('coverage.xml')->project->metrics;
            $row = static function (string $name, int $covered, int $total): string {
                $pct = $total > 0 ? sprintf('%.2f%%', 100 * $covered / $total) : 'n/a';
                return "| {$name} | {$covered} | {$total} | {$pct} |\n";
            };
            echo "### Test coverage (PHP 8.5)\n\n| Metric | Covered | Total | Coverage |\n|---|---|---|---|\n";
            echo $row('Lines', (int) $m['coveredstatements'], (int) $m['statements']);
            echo $row('Methods', (int) $m['coveredmethods'], (int) $m['methods']);
          PHP

      - name: Upload coverage.xml
        if: ${{ !cancelled() && matrix.php == '8.5' && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 14
